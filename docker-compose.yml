# CampoConecta — serviços de domínio e infraestrutura da Parte 3:
#   cp .env.example .env    (e troque as senhas)
#   docker compose up -d --build
#
# Redes por camada:
#   aplicacao        serviços de domínio (e BFFs) conversam entre si
#   dados-<serviço>  internal: só o serviço dono alcança o próprio banco
#   mensageria       broker e participantes da futura SAGA
#   borda            gateway, authn-verify e BFFs
# Só o gateway publica porta para o ambiente externo.

name: campoconecta

# Bloco comum às 4 instâncias PostgreSQL (mesma imagem customizada).
x-postgres: &postgres
  image: campoconecta/postgres:16
  pull_policy: never
  restart: unless-stopped

services:
  # --------------------------------------------------------------- borda
  gateway:
    build: ./infra/gateway
    image: campoconecta/gateway:local
    restart: unless-stopped
    depends_on:
      authn-verify:
        condition: service_healthy
      bff-prefeitura:
        condition: service_healthy
      bff-produtor:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    networks: [borda]

  authn-verify:
    build: ./authn-verify
    image: campoconecta/authn-verify:local
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
    networks: [borda]

  bff-prefeitura:
    build: ./bff-prefeitura
    image: campoconecta/bff-prefeitura:local
    restart: unless-stopped
    environment:
      EDITAIS_URL: http://editais:8000
      COMPRAS_URL: http://compras:8000
      ENTREGAS_URL: http://entregas:8000
      HTTP_TIMEOUT: "2"
    depends_on:
      editais:
        condition: service_healthy
      compras:
        condition: service_healthy
      entregas:
        condition: service_healthy
    networks: [borda, aplicacao]

  bff-produtor:
    build: ./bff-produtor
    image: campoconecta/bff-produtor:local
    restart: unless-stopped
    environment:
      EDITAIS_URL: http://editais:8000
      OFERTAS_URL: http://ofertas:8000
      HTTP_TIMEOUT: "2"
    depends_on:
      editais:
        condition: service_healthy
      ofertas:
        condition: service_healthy
    networks: [borda, aplicacao]

  # -------------------------------------------------------------- mensageria
  rabbitmq:
    image: rabbitmq:4.1-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina RABBITMQ_USER no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:?defina RABBITMQ_VHOST no .env}
    volumes:
      - rabbitmq-dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 15s
      start_period: 60s
      retries: 12
    networks: [mensageria]

  # ------------------------------------------------------------------ dados
  pg-editais:
    <<: *postgres
    # Um único build para a imagem comum: evita quatro exports concorrentes
    # para a mesma tag em instalações com o image store do containerd.
    build: ./infra/postgres
    environment:
      POSTGRES_DB: editais
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?defina PG_ADMIN_PASSWORD no .env}
      APP_DB_USER: app_editais
      APP_DB_PASSWORD: ${EDITAIS_DB_PASSWORD:?defina EDITAIS_DB_PASSWORD no .env}
    volumes:
      - pg-editais-dados:/var/lib/postgresql/data
    networks: [dados-editais]

  pg-ofertas:
    <<: *postgres
    environment:
      POSTGRES_DB: ofertas
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?defina PG_ADMIN_PASSWORD no .env}
      APP_DB_USER: app_ofertas
      APP_DB_PASSWORD: ${OFERTAS_DB_PASSWORD:?defina OFERTAS_DB_PASSWORD no .env}
    volumes:
      - pg-ofertas-dados:/var/lib/postgresql/data
    networks: [dados-ofertas]

  pg-compras:
    <<: *postgres
    environment:
      POSTGRES_DB: compras
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?defina PG_ADMIN_PASSWORD no .env}
      APP_DB_USER: app_compras
      APP_DB_PASSWORD: ${COMPRAS_DB_PASSWORD:?defina COMPRAS_DB_PASSWORD no .env}
    volumes:
      - pg-compras-dados:/var/lib/postgresql/data
    networks: [dados-compras]

  pg-entregas:
    <<: *postgres
    environment:
      POSTGRES_DB: entregas
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?defina PG_ADMIN_PASSWORD no .env}
      APP_DB_USER: app_entregas
      APP_DB_PASSWORD: ${ENTREGAS_DB_PASSWORD:?defina ENTREGAS_DB_PASSWORD no .env}
    volumes:
      - pg-entregas-dados:/var/lib/postgresql/data
    networks: [dados-entregas]

  # -------------------------------------------------------- serviços de domínio
  editais:
    build: ./servicos/editais
    image: campoconecta/editais:local
    restart: unless-stopped
    environment:
      SERVICE_NAME: editais
      DATABASE_URL: postgresql://app_editais:${EDITAIS_DB_PASSWORD}@pg-editais:5432/editais
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
    depends_on:
      pg-editais:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [aplicacao, dados-editais, mensageria]

  ofertas:
    build: ./servicos/ofertas
    image: campoconecta/ofertas:local
    restart: unless-stopped
    environment:
      SERVICE_NAME: ofertas
      DATABASE_URL: postgresql://app_ofertas:${OFERTAS_DB_PASSWORD}@pg-ofertas:5432/ofertas
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
    depends_on:
      pg-ofertas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [aplicacao, dados-ofertas, mensageria]

  compras:
    build: ./servicos/compras
    image: campoconecta/compras:local
    restart: unless-stopped
    environment:
      SERVICE_NAME: compras
      DATABASE_URL: postgresql://app_compras:${COMPRAS_DB_PASSWORD}@pg-compras:5432/compras
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
      EDITAIS_URL: http://editais:8000
      OFERTAS_URL: http://ofertas:8000
      HTTP_TIMEOUT: "2"
    depends_on:
      pg-compras:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      editais:
        condition: service_healthy
      ofertas:
        condition: service_healthy
    networks: [aplicacao, dados-compras, mensageria]

  entregas:
    build: ./servicos/entregas
    image: campoconecta/entregas:local
    restart: unless-stopped
    environment:
      SERVICE_NAME: entregas
      DATABASE_URL: postgresql://app_entregas:${ENTREGAS_DB_PASSWORD}@pg-entregas:5432/entregas
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
    depends_on:
      pg-entregas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [aplicacao, dados-entregas, mensageria]

networks:
  borda: {}
  aplicacao: {}
  mensageria:
    internal: true
  dados-editais:
    internal: true
  dados-ofertas:
    internal: true
  dados-compras:
    internal: true
  dados-entregas:
    internal: true

volumes:
  rabbitmq-dados: {}
  pg-editais-dados: {}
  pg-ofertas-dados: {}
  pg-compras-dados: {}
  pg-entregas-dados: {}
