worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;

    upstream authn_verify {
        server authn-verify:8000;
    }

    upstream bff_prefeitura {
        server bff-prefeitura:8000;
    }

    upstream bff_produtor {
        server bff-produtor:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","servico":"gateway"}';
        }

        location = /prefeitura/token {
            proxy_pass http://authn_verify/token;
            proxy_set_header Content-Type application/json;
        }

        location = /produtor/token {
            proxy_pass http://authn_verify/token;
            proxy_set_header Content-Type application/json;
        }

        location = /_auth {
            internal;
            proxy_pass http://authn_verify/verify;
            proxy_pass_request_body off;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        location ^~ /prefeitura/api/v1/ {
            auth_request /_auth;
            auth_request_set $auth_subject $upstream_http_x_authenticated_subject;
            auth_request_set $auth_role $upstream_http_x_authenticated_role;
            auth_request_set $auth_institution $upstream_http_x_authenticated_institution;
            proxy_set_header X-Authenticated-Subject $auth_subject;
            proxy_set_header X-Authenticated-Role $auth_role;
            proxy_set_header X-Authenticated-Institution $auth_institution;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Correlation-Id $request_id;
            proxy_pass http://bff_prefeitura/api/v1/;
        }

        location ^~ /produtor/api/v1/ {
            auth_request /_auth;
            auth_request_set $auth_subject $upstream_http_x_authenticated_subject;
            auth_request_set $auth_role $upstream_http_x_authenticated_role;
            auth_request_set $auth_producer $upstream_http_x_authenticated_producer;
            proxy_set_header X-Authenticated-Subject $auth_subject;
            proxy_set_header X-Authenticated-Role $auth_role;
            proxy_set_header X-Authenticated-Producer $auth_producer;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Correlation-Id $request_id;
            proxy_pass http://bff_produtor/api/v1/;
        }

        location / {
            return 404 '{"code":"NAO_ENCONTRADO","message":"Recurso externo não encontrado."}';
        }
    }
}