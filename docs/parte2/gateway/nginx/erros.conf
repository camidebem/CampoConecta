# Erros gerados pelo gateway; respostas JSON dos BFFs não são interceptadas.
error_page 401 = @nao_autenticado;
error_page 403 = @sem_permissao;
error_page 404 = @rota_ausente;
error_page 413 = @corpo_excedido;
error_page 429 = @limite_excedido;
error_page 500 502 504 = @dependencia_indisponivel;
location @nao_autenticado { return 401 '{"code":"NAO_AUTENTICADO","message":"Token ausente ou invalido.","details":[],"correlationId":"$correlation_id"}'; }
location @sem_permissao { return 403 '{"code":"ACESSO_NEGADO","message":"Papel, origem ou vinculo nao autorizado.","details":[],"correlationId":"$correlation_id"}'; }
location @rota_ausente { return 404 '{"code":"RECURSO_NAO_ENCONTRADO","message":"Rota externa inexistente.","details":[],"correlationId":"$correlation_id"}'; }
location @corpo_excedido { return 413 '{"code":"CORPO_EXCEDIDO","message":"Corpo acima de 1 MiB.","details":[],"correlationId":"$correlation_id"}'; }
location @limite_excedido { return 429 '{"code":"LIMITE_EXCEDIDO","message":"Limite de requisicoes excedido.","details":[],"correlationId":"$correlation_id"}'; }
location @dependencia_indisponivel { return 503 '{"code":"DEPENDENCIA_INDISPONIVEL","message":"Verificador ou BFF indisponivel.","details":[],"correlationId":"$correlation_id"}'; }
