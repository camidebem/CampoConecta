# Include de location: limites IP e auth precedem o salto privado.
if ($request_method = OPTIONS) { return 204; }
limit_req zone=por_ip burst=20 nodelay;
auth_request /_auth;
proxy_set_header Host api.campoconecta.example;
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Correlation-Id $correlation_id;
proxy_set_header X-Authenticated-Subject $verified_sub;
proxy_set_header X-Authenticated-Role $verified_role;
proxy_set_header X-Authenticated-Institution $verified_institution;
proxy_set_header X-Authenticated-Producer $verified_producer;
proxy_set_header X-User-Id "";
proxy_set_header X-Papel "";
proxy_set_header X-Instituicao-Id "";
proxy_set_header X-Produtor-Id "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_hide_header X-Correlation-Id;
proxy_hide_header WWW-Authenticate;
proxy_hide_header Retry-After;
# Sem URI em proxy_pass: preserva o caminho para o segundo listener.
proxy_pass http://gateway_identidade;
