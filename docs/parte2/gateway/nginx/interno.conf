# Include de location privada. Headers vieram do salto que executou auth_request.
proxy_set_header Host $proxy_host;
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Correlation-Id $correlation_id;
proxy_set_header X-Authenticated-Subject $http_x_authenticated_subject;
proxy_set_header X-Authenticated-Role $http_x_authenticated_role;
proxy_set_header X-Authenticated-Institution $http_x_authenticated_institution;
proxy_set_header X-Authenticated-Producer $http_x_authenticated_producer;
proxy_set_header X-User-Id "";
proxy_set_header X-Papel "";
proxy_set_header X-Instituicao-Id "";
proxy_set_header X-Produtor-Id "";
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
