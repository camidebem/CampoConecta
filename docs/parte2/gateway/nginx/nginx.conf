# Configuração de referência. Não é uma implantação.
# Executar nginx -t com prefixo contendo estes includes, logs/, certs/ e DNS interno.
# Requer ngx_http_auth_request_module e ngx_http_ssl_module.
worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events { worker_connections 1024; }

http {
    map_hash_bucket_size 128;
    default_type application/json;
    server_tokens off;
    client_max_body_size 1m;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    # Não repetir escritas implicitamente em outro upstream.
    proxy_next_upstream off;
    proxy_intercept_errors off;

    map $request_id $generated_correlation {
        "~^(?<ca>[0-9a-f]{8})(?<cb>[0-9a-f]{4})(?<cc>[0-9a-f]{4})(?<cd>[0-9a-f]{4})(?<ce>[0-9a-f]{12})$" "$ca-$cb-$cc-$cd-$ce";
    }
    map $http_x_correlation_id $correlation_id {
        "~*^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $http_x_correlation_id;
        default $generated_correlation;
    }
    map $http_origin $cors_origin {
        default "";
        "https://portal.campoconecta.example" $http_origin;
    }
    map $http_origin $cors_refused {
        default 1;
        "" 0;
        "https://portal.campoconecta.example" 0;
    }
    map $status $auth_challenge { default ""; 401 "Bearer"; }
    map $status $retry_seconds { default ""; 429 "1"; 503 "5"; }
    map $upstream_http_retry_after $gateway_retry {
        default $upstream_http_retry_after;
        "" $retry_seconds;
    }
    limit_req_zone $binary_remote_addr zone=por_ip:10m rate=10r/s;
    # Só é usada no segundo listener, depois de auth_request no primeiro salto.
    limit_req_zone $http_x_authenticated_subject zone=por_identidade:10m rate=5r/s;
    limit_req_status 429;
    log_format api escape=json '{"correlationId":"$correlation_id","method":"$request_method","path":"$uri","status":$status}';
    access_log logs/access.log api;

    upstream verificador { server authn-verify:8000; }
    upstream gateway_identidade { server 127.0.0.1:8081; }
    upstream bff_prefeitura { server bff-prefeitura:8000; }
    upstream bff_produtor { server bff-produtor:8000; }

    server {
        listen 80;
        server_name api.campoconecta.example;
        return 308 https://api.campoconecta.example$request_uri;
    }
    server {
        listen 443 ssl;
        server_name api.campoconecta.example;
        ssl_certificate certs/tls.crt;
        ssl_certificate_key certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Correlation-Id $correlation_id always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id, If-None-Match" always;
        add_header Access-Control-Expose-Headers "Location, ETag, Retry-After, X-Correlation-Id" always;
        add_header WWW-Authenticate $auth_challenge always;
        add_header Retry-After $gateway_retry always;
        auth_request_set $verified_sub $upstream_http_x_authenticated_subject;
        auth_request_set $verified_role $upstream_http_x_authenticated_role;
        auth_request_set $verified_institution $upstream_http_x_authenticated_institution;
        auth_request_set $verified_producer $upstream_http_x_authenticated_producer;
        include erros.conf;
        if ($cors_refused) { return 403; }

        location = /health { return 200 '{"status":"ok"}'; }
        location = /_auth {
            internal;
            proxy_pass http://verificador/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Correlation-Id $correlation_id;
            proxy_set_header X-Authenticated-Subject "";
            proxy_set_header X-Authenticated-Role "";
            proxy_set_header X-Authenticated-Institution "";
            proxy_set_header X-Authenticated-Producer "";
        }
        location = /prefeitura/api/v1 { return 404; }
        location = /produtor/api/v1 { return 404; }
        location ^~ /prefeitura/api/v1/ { include externo.conf; }
        location ^~ /produtor/api/v1/ { include externo.conf; }
        location / { return 404; }
    }

    # Listener privado no mesmo processo/host: não expor por Service ou porta pública.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        include erros.conf;
        if ($http_x_authenticated_subject = "") { return 403; }
        location ^~ /prefeitura/api/v1/ {
            limit_req zone=por_identidade burst=10 nodelay;
            include interno.conf;
            proxy_pass http://bff_prefeitura/api/v1/;
        }
        location ^~ /produtor/api/v1/ {
            limit_req zone=por_identidade burst=10 nodelay;
            include interno.conf;
            proxy_pass http://bff_produtor/api/v1/;
        }
        location / { return 404; }
    }
}
